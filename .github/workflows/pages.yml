name: Deploy na GitHub Pages

on:
  push:
    branches:
      - main
      - claude/training-app-github-pages-3q1qrd
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Nastavení Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload statických souborů
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
