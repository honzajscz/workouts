<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trénink se přestěhoval</title>
  <meta name="robots" content="noindex">
  <meta http-equiv="refresh" content="3;url=https://honzajscz.github.io/learning-apps/trenink/">
  <style>
    body { margin: 0; min-height: 100dvh; display: flex; align-items: center; justify-content: center; background: #0b1220; color: #e9eefb; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; text-align: center; padding: 24px; }
    a { color: #a3e635; font-weight: 700; }
    p { max-width: 420px; line-height: 1.5; }
  </style>
</head>
<body>
  <p>🏋️ Trénink má novou adresu:<br>
    <a id="lnk" href="https://honzajscz.github.io/learning-apps/trenink/">honzajscz.github.io/learning-apps/trenink/</a><br><br>
    <small>Tvoje tréninky a historie zůstávají (data jsou uložená pro celou doménu). Starou ikonu na ploše smaž a z nové adresy si přidej novou.</small></p>
  <script>
    // Přesměrovací stránka po přesunu appky do repozitáře learning-apps.
    // Odregistruje starý service worker této cesty, smaže jeho cache a přesměruje.
    // Cache Storage je společná pro celou doménu: mažou se jen cache staré appky
    // z této cesty (trenink-v1 až trenink-v14), nová appka v learning-apps má v15 a výš.
    const isLegacy = k => { const m = /^trenink-v(\d+)$/.exec(k); return !!m && Number(m[1]) <= 14; };
    (async () => {
      try {
        if ("serviceWorker" in navigator) {
          const regs = await navigator.serviceWorker.getRegistrations();
          for (const r of regs) if (r.scope.endsWith("/workouts/")) await r.unregister();
        }
        if (window.caches) {
          const keys = await caches.keys();
          for (const k of keys) if (isLegacy(k)) await caches.delete(k);
        }
      } catch { /* ignore */ }
      location.replace(document.getElementById("lnk").href + location.hash);
    })();
  </script>
</body>
</html>
